name: CI

# One workflow. A single native job runs clippy, the all-features check and
# the tests one after the other, so the expensive part of the build
# (egui, eframe for the examples, Tracy)
# is compiled once and shared. Pull requests only read the build cache; it is
# written by pushes to master.
#
# `Cargo.lock` is not versioned (this is a library), so there is no `--locked`:
# CI builds against the newest dependencies that `Cargo.toml` allows, which is
# what a consumer of the crate gets.
on:
  pull_request:
    branches: [master]
    paths-ignore:
      - "**.md"
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request replaces the run in progress; a run on master
  # always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  CARGO_HTTP_MULTIPLEXING: false
  # Backtraces with line numbers only: smaller artifacts and a faster build.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Libraries: the platform-specific code is thin, so Linux is enough for the
  # native build; the browser target is checked separately.
  test:
    name: clippy and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          # A failed run still leaves the dependencies compiled for the next one.
          cache-on-failure: true
      # The library, its tests and the examples (eframe).
      - run: cargo clippy --all-targets -- -D warnings
      # All features (Tracy profiling included): compiled, not run.
      - run: cargo check --all-targets --all-features
      # Integration tests and doc tests.
      - run: cargo test

  # The crate is meant to run in the browser too (`web-time` replaces
  # `std::time::Instant` there); only the library is built, the examples
  # need a native window.
  wasm:
    name: check wasm32
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true
      - run: cargo check --lib --all-features --target wasm32-unknown-unknown

  # The one check to require if branch protection is turned on.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [fmt, test, wasm]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a job failed or was cancelled
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::a CI job did not pass"
            exit 1
          fi

  # Line coverage; kept as an artifact, no external service.
  coverage:
    name: coverage
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run the tests with coverage
        run: cargo llvm-cov --no-report
      - name: Write the report
        env:
          IGNORE: '(cargo/registry|rustc)'
        run: |
          cargo llvm-cov report --ignore-filename-regex "$IGNORE" --lcov --output-path lcov.info
          {
            echo '## Line coverage'
            echo '```'
            cargo llvm-cov report --ignore-filename-regex "$IGNORE" --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
